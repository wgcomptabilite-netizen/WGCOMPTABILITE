<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W&G Comptabilité</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0e1b2e;
    --navy-mid: #162440;
    --gold: #b89a5a;
    --gold-light: #d4b87a;
    --cream: #f8f5ef;
    --cream-dark: #ede8df;
    --text-muted: #7a7060;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--navy);
    min-height: 100vh;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 3rem;
    background: rgba(248,245,239,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(184,154,90,0.18);
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--navy);
  }

  .logo span { color: var(--gold); }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 2.5rem;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 2.5rem;
  }

  nav a {
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  nav a:hover { color: var(--gold); }

  /* LANG TOGGLE */
  .lang-toggle {
    display: flex;
    align-items: center;
    border: 1px solid rgba(184,154,90,0.35);
    overflow: hidden;
  }

  .lang-btn {
    background: none;
    border: none;
    padding: 0.35rem 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
  }

  .lang-btn.active {
    background: var(--gold);
    color: var(--navy);
  }

  .lang-divider {
    width: 1px;
    height: 18px;
    background: rgba(184,154,90,0.35);
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding-top: 5rem;
  }

  .hero-left {
    background: var(--navy);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6rem 5rem;
    position: relative;
    overflow: hidden;
  }

  .hero-left::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 360px; height: 360px;
    border-radius: 50%;
    border: 1px solid rgba(184,154,90,0.12);
  }

  .hero-left::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    border: 1px solid rgba(184,154,90,0.08);
  }

  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.5rem;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 5vw, 4.5rem);
    font-weight: 300;
    line-height: 1.1;
    color: var(--cream);
    margin-bottom: 1rem;
  }

  .hero-title em {
    font-style: italic;
    color: var(--gold-light);
  }

  .hero-subtitle {
    font-size: 0.9rem;
    font-weight: 300;
    line-height: 1.8;
    color: rgba(248,245,239,0.55);
    margin-bottom: 3rem;
    max-width: 340px;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--gold);
    color: var(--navy);
    padding: 0.9rem 2rem;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, transform 0.15s;
    width: fit-content;
  }

  .cta-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
  .cta-btn svg { transition: transform 0.2s; }
  .cta-btn:hover svg { transform: translateX(3px); }

  .hero-right {
    background: var(--cream-dark);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 6rem 4rem;
    text-align: center;
  }

  .monogram {
    width: 120px; height: 120px;
    border: 1px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2.5rem;
    position: relative;
  }

  .monogram::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(184,154,90,0.3);
  }

  .monogram span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.05em;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    font-style: italic;
    color: var(--navy);
    margin-bottom: 0.75rem;
  }

  .tagline-sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin: 1.5rem auto;
  }

  .contact-pills {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 2rem;
    text-align: left;
    width: 100%;
    max-width: 260px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .pill-icon {
    width: 28px; height: 28px;
    border: 1px solid rgba(184,154,90,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .pill-icon svg { width: 13px; height: 13px; stroke: var(--gold); fill: none; stroke-width: 1.5; }

  /* SERVICES */
  .services {
    padding: 7rem 5rem;
    background: var(--cream);
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 2rem;
    margin-bottom: 4rem;
  }

  .section-label {
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 300;
    color: var(--navy);
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: 1px solid rgba(14,27,46,0.12);
  }

  .service-card {
    padding: 2.5rem 2rem;
    border-right: 1px solid rgba(14,27,46,0.12);
    transition: background 0.25s;
    cursor: default;
  }

  .service-card:last-child { border-right: none; }
  .service-card:hover { background: var(--navy); }
  .service-card:hover .svc-num, .service-card:hover .svc-name { color: var(--cream); }
  .service-card:hover .svc-desc { color: rgba(248,245,239,0.5); }
  .service-card:hover .svc-line { background: var(--gold); }

  .svc-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 2rem;
    display: block;
  }

  .svc-line {
    width: 24px; height: 1px;
    background: rgba(184,154,90,0.4);
    margin-bottom: 1.25rem;
    transition: background 0.25s;
  }

  .svc-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 400;
    color: var(--navy);
    line-height: 1.2;
    margin-bottom: 1rem;
    transition: color 0.25s;
  }

  .svc-desc {
    font-size: 0.78rem;
    line-height: 1.8;
    color: var(--text-muted);
    transition: color 0.25s;
  }

  /* WHY */
  .why {
    background: var(--navy);
    padding: 7rem 5rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5rem;
    align-items: center;
  }

  .why-left .section-title { color: var(--cream); }
  .why-left .section-label { color: var(--gold); }

  .why-body {
    font-size: 0.9rem;
    line-height: 1.9;
    color: rgba(248,245,239,0.55);
    margin-top: 1.5rem;
  }

  .why-right {
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .why-item {
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
    padding-bottom: 2rem;
    border-bottom: 1px solid rgba(184,154,90,0.1);
  }

  .why-item:last-child { border-bottom: none; padding-bottom: 0; }

  .why-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
    flex-shrink: 0;
    width: 2.5rem;
  }

  .why-item-title {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--cream);
    margin-bottom: 0.4rem;
  }

  .why-item-desc {
    font-size: 0.78rem;
    line-height: 1.7;
    color: rgba(248,245,239,0.45);
  }

  /* CONTACT */
  .contact {
    padding: 7rem 5rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6rem;
    align-items: start;
  }

  .contact-detail {
    margin-top: 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .contact-row {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .contact-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .contact-val {
    font-size: 0.9rem;
    color: var(--navy);
  }

  .contact-form { display: flex; flex-direction: column; gap: 1.25rem; }

  .form-row { display: flex; flex-direction: column; gap: 0.4rem; }
  .form-label { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }

  input[type="text"], input[type="email"], textarea {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    padding: 0.75rem 1rem;
    border: 1px solid rgba(14,27,46,0.15);
    background: var(--cream-dark);
    color: var(--navy);
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    width: 100%;
  }

  input:focus, textarea:focus { border-color: var(--gold); }

  .submit-btn {
    align-self: flex-start;
    background: var(--navy);
    color: var(--cream);
    border: none;
    padding: 0.9rem 2.25rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }

  .submit-btn:hover { background: var(--gold); color: var(--navy); }

  /* FOOTER */
  footer {
    background: var(--navy-mid);
    padding: 2rem 5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(184,154,90,0.12);
  }

  .footer-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    color: var(--cream);
    letter-spacing: 0.08em;
  }

  .footer-logo span { color: var(--gold); }

  .footer-copy {
    font-size: 0.72rem;
    color: rgba(248,245,239,0.3);
    letter-spacing: 0.08em;
  }

  .footer-cpa {
    font-size: 0.7rem;
    color: var(--gold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .reveal.visible { opacity: 1; transform: none; }

  [data-lang] { transition: opacity 0.2s; }
</style>
</head>
<body>

<nav>
  <div class="logo">W<span>&</span>G Comptabilité</div>
  <div class="nav-right">
    <ul>
      <li><a href="#services" data-fr="Services" data-en="Services">Services</a></li>
      <li><a href="#apropos" data-fr="À propos" data-en="About">À propos</a></li>
      <li><a href="#contact" data-fr="Contact" data-en="Contact">Contact</a></li>
    </ul>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('fr')">FR</button>
      <div class="lang-divider"></div>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-left">
    <p class="eyebrow">CPA · Ordre des CPA du Québec</p>
    <h1 class="hero-title">
      <span data-lang data-fr="Une comptabilité <em>rigoureuse,</em> une relation de confiance." data-en="<em>Rigorous</em> accounting, a relationship built on trust."></span>
    </h1>
    <p class="hero-subtitle" data-lang data-fr="Services professionnels en fiscalité, tenue de livres et états financiers — pour particuliers et entreprises au Québec." data-en="Professional services in taxation, bookkeeping, and financial statements — for individuals and businesses in Quebec."></p>
    <a href="#contact" class="cta-btn">
      <span data-lang data-fr="Prendre contact" data-en="Get in touch"></span>
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h12M11 6l5 4-5 4"/></svg>
    </a>
  </div>

  <div class="hero-right">
    <div class="monogram"><span>W&G</span></div>
    <p class="tagline" data-lang data-fr="L'expertise à votre service." data-en="Expertise at your service."></p>
    <p class="tagline-sub" data-lang data-fr="Comptables professionnels agréés" data-en="Chartered Professional Accountants"></p>
    <div class="divider"></div>
    <div class="contact-pills">
      <div class="pill">
        <div class="pill-icon">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 3.07 5.18 2 2 0 0 1 5.07 3h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L9.91 10a16 16 0 0 0 6.07 6.07l.42-.42a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        (438) 498-6969
      </div>
      <div class="pill">
        <div class="pill-icon">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        wgcomptabilite@gmail.com
      </div>
      <div class="pill">
        <div class="pill-icon">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        Montréal, Québec
      </div>
    </div>
  </div>
</section>

<!-- SERVICES -->
<section class="services" id="services">
  <div class="section-header reveal">
    <span class="section-label" data-lang data-fr="01 — Services" data-en="01 — Services"></span>
    <h2 class="section-title" data-lang data-fr="Ce que nous offrons" data-en="What we offer"></h2>
  </div>
  <div class="services-grid reveal">
    <div class="service-card">
      <span class="svc-num">01</span>
      <div class="svc-line"></div>
      <h3 class="svc-name" data-lang data-fr="Fiscalité" data-en="Taxation"></h3>
      <p class="svc-desc" data-lang data-fr="Déclarations de revenus pour particuliers et sociétés, planification fiscale stratégique et optimisation." data-en="Income tax returns for individuals and corporations, strategic tax planning and optimization."></p>
    </div>
    <div class="service-card">
      <span class="svc-num">02</span>
      <div class="svc-line"></div>
      <h3 class="svc-name" data-lang data-fr="Tenue de livres" data-en="Bookkeeping"></h3>
      <p class="svc-desc" data-lang data-fr="Suivi rigoureux de vos transactions, conciliation bancaire et rapports mensuels clairs." data-en="Rigorous tracking of your transactions, bank reconciliation, and clear monthly reports."></p>
    </div>
    <div class="service-card">
      <span class="svc-num">03</span>
      <div class="svc-line"></div>
      <h3 class="svc-name" data-lang data-fr="États financiers" data-en="Financial Statements"></h3>
      <p class="svc-desc" data-lang data-fr="Préparation d'avis au lecteur, bilans, états des résultats conformes aux normes comptables." data-en="Preparation of notice to reader, balance sheets, and income statements compliant with accounting standards."></p>
    </div>
    <div class="service-card">
      <span class="svc-num">04</span>
      <div class="svc-line"></div>
      <h3 class="svc-name" data-lang data-fr="Conseil & budget" data-en="Advisory & Budgeting"></h3>
      <p class="svc-desc" data-lang data-fr="Analyse financière, budgétisation et accompagnement stratégique pour votre croissance." data-en="Financial analysis, budgeting, and strategic guidance to support your growth."></p>
    </div>
  </div>
</section>

<!-- WHY US -->
<section class="why" id="apropos">
  <div class="why-left reveal">
    <span class="section-label" data-lang data-fr="02 — À propos" data-en="02 — About"></span>
    <h2 class="section-title" style="color:var(--cream);" data-lang data-fr="Pourquoi nous choisir" data-en="Why choose us"></h2>
    <p class="why-body" data-lang data-fr="Chez W&G Comptabilité, nous croyons que la comptabilité va au-delà des chiffres — c'est une relation de confiance bâtie sur la rigueur, la transparence et un engagement envers votre succès financier." data-en="At W&G Comptabilité, we believe accounting goes beyond numbers — it's a relationship of trust built on rigour, transparency, and a commitment to your financial success."></p>
  </div>
  <div class="why-right reveal">
    <div class="why-item">
      <div class="why-num">01</div>
      <div>
        <p class="why-item-title" data-lang data-fr="CPA certifiés, Ordre du Québec" data-en="Certified CPAs, Quebec Order"></p>
        <p class="why-item-desc" data-lang data-fr="Membres en règle de l'Ordre des CPA du Québec, avec une formation continue rigoureuse." data-en="Active members of the Ordre des CPA du Québec, with rigorous ongoing professional development."></p>
      </div>
    </div>
    <div class="why-item">
      <div class="why-num">02</div>
      <div>
        <p class="why-item-title" data-lang data-fr="Approche personnalisée" data-en="Personalized approach"></p>
        <p class="why-item-desc" data-lang data-fr="Chaque client est unique. Nous adaptons nos services à votre réalité et vos objectifs." data-en="Every client is unique. We tailor our services to your reality and your goals."></p>
      </div>
    </div>
    <div class="why-item">
      <div class="why-num">03</div>
      <div>
        <p class="why-item-title" data-lang data-fr="Disponibilité & réactivité" data-en="Availability & responsiveness"></p>
        <p class="why-item-desc" data-lang data-fr="Un interlocuteur dédié, des réponses rapides et une communication claire à chaque étape." data-en="A dedicated point of contact, quick responses, and clear communication at every step."></p>
      </div>
    </div>
  </div>
</section>

<!-- CONTACT -->
<section class="contact" id="contact">
  <div class="contact-info reveal">
    <span class="section-label" data-lang data-fr="03 — Contact" data-en="03 — Contact"></span>
    <h2 class="section-title" style="margin-top:0.5rem;" data-lang data-fr="Parlons de votre situation." data-en="Let's talk about your situation."></h2>
    <div class="contact-detail">
      <div class="contact-row">
        <span class="contact-label" data-lang data-fr="Téléphone" data-en="Phone"></span>
        <span class="contact-val">(438) 498-6969</span>
      </div>
      <div class="contact-row">
        <span class="contact-label" data-lang data-fr="Courriel" data-en="Email"></span>
        <span class="contact-val">wgcomptabilite@gmail.com</span>
      </div>
      <div class="contact-row">
        <span class="contact-label" data-lang data-fr="Localisation" data-en="Location"></span>
        <span class="contact-val">Montréal, Québec</span>
      </div>
      <div class="contact-row">
        <span class="contact-label" data-lang data-fr="Langues" data-en="Languages"></span>
        <span class="contact-val" data-lang data-fr="Français · English" data-en="English · Français"></span>
      </div>
    </div>
  </div>

  <div class="contact-form reveal">
    <div class="form-row">
      <label class="form-label" data-lang data-fr="Nom complet" data-en="Full name"></label>
      <input type="text" id="input-name" placeholder="Jean Tremblay">
    </div>
    <div class="form-row">
      <label class="form-label" data-lang data-fr="Courriel" data-en="Email"></label>
      <input type="email" id="input-email" placeholder="jean@exemple.ca">
    </div>
    <div class="form-row">
      <label class="form-label" data-lang data-fr="Service recherché" data-en="Service needed"></label>
      <input type="text" id="input-service" data-fr-placeholder="Déclarations, tenue de livres..." data-en-placeholder="Tax return, bookkeeping...">
    </div>
    <div class="form-row">
      <label class="form-label" data-lang data-fr="Message" data-en="Message"></label>
      <textarea rows="4" id="input-msg" data-fr-placeholder="Décrivez brièvement votre situation..." data-en-placeholder="Briefly describe your situation..."></textarea>
    </div>
    <button class="submit-btn" data-lang data-fr="Envoyer le message" data-en="Send message"></button>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">W<span>&</span>G Comptabilité</div>
  <p class="footer-cpa" data-lang data-fr="Membres · Ordre des CPA du Québec" data-en="Members · Ordre des CPA du Québec"></p>
  <p class="footer-copy">© 2026 W&G Comptabilité.</p>
</footer>

<script>
const reveals = document.querySelectorAll('.reveal');
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.12 });
reveals.forEach(r => io.observe(r));

document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const t = document.querySelector(a.getAttribute('href'));
    if(t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

let currentLang = 'fr';

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;

  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');

  document.querySelectorAll('[data-lang]').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if (val !== null) el.innerHTML = val;
  });

  // nav links
  document.querySelectorAll('nav a[data-fr]').forEach(el => {
    el.textContent = el.getAttribute('data-' + lang);
  });

  // placeholders
  const svc = document.getElementById('input-service');
  if (svc) svc.placeholder = svc.getAttribute('data-' + lang + '-placeholder');
  const msg = document.getElementById('input-msg');
  if (msg) msg.placeholder = msg.getAttribute('data-' + lang + '-placeholder');
}

setLang('fr');
</script>
</body>
</html>
