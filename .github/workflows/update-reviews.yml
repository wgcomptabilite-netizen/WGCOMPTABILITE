name: Mise à jour des avis Google
on:
  schedule:
    - cron: '17 12 * * 1'   # chaque lundi, vers 7 h 17 (heure de l'Est)
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire la note et le nombre d'avis
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python3 scripts/update_reviews.py
      - name: Publier si changement
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "W&G avis bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Avis Google : mise à jour automatique"
            git push
          fi
